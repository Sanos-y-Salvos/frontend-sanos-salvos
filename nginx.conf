server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Endpoint publico de reportes — va directo al BFF sin JWT del gateway
    location = /api/mascotas/reportes {
        proxy_pass http://backforfrontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header WWW-Authenticate;
        proxy_read_timeout 60s;
    }

    # API Gateway — todas las demas llamadas /api/*
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header WWW-Authenticate;
        proxy_read_timeout 60s;
    }

    # Fotos de mascotas (evita que la regla de cache intercepte antes)
    location ^~ /uploads/ {
        proxy_pass http://ms-mascotas:3003;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_read_timeout 30s;
    }

    # Mensajeria WebSocket / Socket.IO
    location /socket.io/ {
        proxy_pass http://ms-mensajeria-privada:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # Mensajeria REST (salas)
    location /salas {
        proxy_pass http://ms-mensajeria-privada:3006;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header WWW-Authenticate;
        proxy_read_timeout 60s;
    }

    # SPA — todas las rutas apuntan a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estaticos con hash en el nombre
    location ~* \.(js|css|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
