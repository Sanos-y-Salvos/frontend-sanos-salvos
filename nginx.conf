server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Endpoint publico de reportes — va directo al BFF sin pasar por el gateway con JWT
    location = /api/mascotas/reportes {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header WWW-Authenticate;
        proxy_read_timeout 60s;
    }

    # API Gateway — todas las demas llamadas /api/* pasan por el gateway
    location /api/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header WWW-Authenticate;
        proxy_read_timeout 60s;
    }

    # SPA — todas las rutas apuntan a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets con hash en el nombre
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
