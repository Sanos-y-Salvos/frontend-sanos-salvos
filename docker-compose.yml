services:

  # ── Frontend (React + Vite → Nginx) ──────────────────────────────────────────

  frontend:
    container_name: frontend
    image: felruiz/frontend-sanos-salvos:latest
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "80:80"
    restart: unless-stopped

networks:
  default:
    driver: bridge
